<div class="create-treatment-dialog">
  <form class="input-dialog">
    <div class="form-field" style="grid-column: 1 / -1;">
      <p>{{ data.message }}</p>
    </div>
    <div class="dialog-actions">
      <button type="button" class="save-button" (click)="onSave()">שמור</button>
      <button type="button" class="cancel-button" (click)="onCancel()"><b>ביטול</b></button>
    </div>
  </form>
</div>
