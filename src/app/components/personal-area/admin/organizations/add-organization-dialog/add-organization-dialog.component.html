<h2 mat-dialog-title>{{ isEdit ? 'עריכת ארגון' : 'הוספת ארגון' }}</h2>
<form [formGroup]="organizationForm" (ngSubmit)="onSubmit()" class="dialog-form">
  <mat-form-field appearance="fill" class="full-width">
    <mat-label>שם הארגון</mat-label>
    <input matInput formControlName="name" required>
    <mat-error *ngIf="organizationForm.get('name')?.hasError('required')">
      חובה להזין שם ארגון
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>כתובת</mat-label>
    <input matInput formControlName="address">
  </mat-form-field>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>טלפון</mat-label>
    <input matInput formControlName="phone">
  </mat-form-field>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>אימייל</mat-label>
    <input matInput formControlName="email">
    <mat-error *ngIf="organizationForm.get('email')?.hasError('email')">
      אימייל לא תקין
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>הערות</mat-label>
    <textarea matInput formControlName="notes"></textarea>
  </mat-form-field>

  <div class="dialog-actions">
    <button mat-flat-button color="primary" type="submit" [disabled]="organizationForm.invalid || isSubmitting">
      {{ isEdit ? 'עדכן' : 'הוסף' }}
    </button>
    <button mat-button type="button" (click)="onCancel()" [disabled]="isSubmitting">ביטול</button>
  </div>
</form>
