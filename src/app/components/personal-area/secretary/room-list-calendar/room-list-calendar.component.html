<div class="room-list-calendar-container">
  <div class="room-list-card">
    <div class="card-header">
      <h3>רשימת חדרים</h3>
    </div>
    <div class="card-content">
      <div *ngIf="rooms.length === 0" class="no-rooms">
        <p>אין חדרים להצגה</p>
      </div>
      <div *ngIf="rooms.length > 0">
        <div 
          class="room-card" 
          *ngFor="let room of rooms"
          [class.selected]="room.room_id === selectedRoomId"
          (click)="selectRoom(room.room_id)">
          <div class="room-info">
            <span class="room-name">{{ room.room_name }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="calendar-panel">
    <div *ngIf="selectedRoomId">
      <app-room-calendar [roomId]="selectedRoomId" [events]="roomEvents"></app-room-calendar>
    </div>
    <div *ngIf="!selectedRoomId" class="calendar-placeholder">
      <p>בחר חדר להצגת היומן</p>
    </div>
  </div>
</div>
