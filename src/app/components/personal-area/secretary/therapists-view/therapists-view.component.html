<div class="view-container">
  <div class="right-panel">
    <app-therapist-list 
      (therapistSelected)="onTherapistSelected($event)">
    </app-therapist-list>
  </div>
  
  <div class="left-panel">
    <!-- תצוגת ברירת מחדל - סיכומים -->
    <div *ngIf="!showDetails" class="summary-view">
      <div class="summary-card">
        <h2>סיכום מטפלים</h2> 
        <p class="instruction">בחר מטפל מהרשימה לצפייה בפרטים</p>
      </div>
    </div>

    <!-- תצוגת פרטי מטפל -->
    <div *ngIf="showDetails && selectedTherapist" class="details-view">
      <div class="details-card">
        <div class="details-header">
          <h2>פרטי מטפל</h2>
          <button class="close-btn" (click)="onCloseDetails()">
            <mat-icon>close</mat-icon>
          </button>
        </div>
        
        <div class="details-content">
          <div class="detail-section">
            <mat-icon>person</mat-icon>
            <div>
              <label>שם מלא:</label>
              <p>{{ selectedTherapist.user.first_name }} {{ selectedTherapist.user.last_name }}</p>
            </div>
          </div>
          
          <div class="detail-section">
            <mat-icon>email</mat-icon>
            <div>
              <label>אימייל:</label>
              <p>{{ selectedTherapist.user.email }}</p>
            </div>
          </div>
          
          <div class="detail-section">
            <mat-icon>phone</mat-icon>
            <div>
              <label>טלפון:</label>
              <p>{{ selectedTherapist.user.phone || 'לא צוין' }}</p>
            </div>
          </div>
          
          <div class="detail-section">
            <mat-icon>badge</mat-icon>
            <div>
              <label>מזהה מטפל:</label>
              <p>{{ selectedTherapist.therapist.therapist_id }}</p>
            </div>
          </div>
          
          <!-- הוסף פרטים נוספים לפי הצורך -->
        </div>
        
        <div class="details-actions">
          <button class="action-btn primary">
            <mat-icon>edit</mat-icon>
            <span>ערוך פרטים</span>
          </button>
          <button class="action-btn">
            <mat-icon>calendar_today</mat-icon>
            <span>יומן</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
