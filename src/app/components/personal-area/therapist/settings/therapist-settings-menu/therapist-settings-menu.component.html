<div class="settings-layout">
	<div class="settings-menu" [class.closed]="menuClosed">
		<button class="toggle-menu-btn" (click)="toggleMenu()">
			<mat-icon>{{ menuClosed ? 'chevron_left' : 'chevron_right' }}</mat-icon>
		</button>
		<h2 *ngIf="!menuClosed">תפריט הגדרות</h2>
		<ul *ngIf="!menuClosed">
			<li>
				<button type="button" (click)="onSelect('system')">הגדרות מערכת</button>
			</li>
			<li>
				<button type="button" (click)="onSelect('treatment-types')">הגדרות סוגי טיפולים</button>
			</li>
			<li>
				<button type="button" (click)="onSelect('homepage-display')">הגדרות תצוגת דף הבית</button>
			</li>
			<!-- בהמשך נוסיף כאן עוד הגדרות -->
		</ul>
	</div>
</div>
