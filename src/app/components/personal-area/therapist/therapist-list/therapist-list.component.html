<!-- therapist-list.component.html -->
<div class="list-card">
  <div class="card-header">
    <h3>רשימת מטפלים</h3>
    <div class="header-actions">
      <button class="add-item-btn" (click)="openAddTherapistDialog()" [disabled]="isLoading"
        matTooltip="הוסף מטפל חדש" matTooltipPosition="below">
        <mat-icon>add</mat-icon>
        <span>הוסף מטפל</span>
      </button>
      <div style="display: flex; flex-direction: column; gap: 0.5rem; align-items: flex-start;">
        <button class="search-btn" (click)="openSearchDialog()" [disabled]="isLoading" matTooltip="חיפוש מטפל">
          <mat-icon>search</mat-icon>
          <span>חיפוש</span>
        </button>
        <select id="statusFilter" [(ngModel)]="statusFilter" style="margin-right: 0.5rem; padding: 0.3rem 0.7rem; border-radius: 6px; border: 1px solid #cfd8dc; background: #f5f5f5; font-size: 1rem; min-width: 90px; color: #000000;">
          <option value="all">הכל</option>
          <option value="active">פעילים</option>
          <option value="inactive">לא פעילים</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card-content">
    <!-- אינדיקטור טעינה -->
  <div *ngIf="isLoading" class="loading-container">
      <mat-spinner diameter="40"></mat-spinner>
    </div>

    <!-- רשימת מטפלים -->
    <div *ngIf="!isLoading && filteredTherapists.length > 0">
      <div 
        class="list-item-card" 
        *ngFor="let therapist of filteredTherapists"
        [class.selected]="selectedTherapistId === (therapist.therapist.therapist_id)">
        <div class="item-info" (click)="viewTherapistDetails(therapist)">
          <span class="item-name">{{ therapist.person.first_name }} {{ therapist.person.last_name }}</span>
        </div>
        <div class="list-actions">
          <button 
            class="menu-button"
            [matMenuTriggerFor]="therapistMenu"
            (click)="$event.stopPropagation()"
            matTooltip="פעולות">
            <mat-icon>more_vert</mat-icon>
          </button>
          <mat-menu #therapistMenu="matMenu" xPosition="before" [backdropClass]="'transparent-backdrop'">
            <button mat-menu-item (click)="viewTherapistDetails(therapist)">
              <mat-icon>person</mat-icon>
              <span>הצג פרטי מטפל</span>
            </button>
            <button mat-menu-item (click)="openTherapistCalendar(therapist.therapist)">
              <mat-icon>calendar_today</mat-icon>
              <span>יומן של מטפל</span>
            </button>
          </mat-menu>
        </div>
      </div>
    </div>

    <!-- הודעה אם אין מטפלים -->
  <div *ngIf="!isLoading && filteredTherapists.length === 0" class="no-items">
      <p>אין מטפלים כרגע</p>
      <p>לחץ על "הוסף מטפל" כדי להתחיל</p>
    </div>
  </div>
</div>
