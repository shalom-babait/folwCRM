<div class="view-container">
  <div class="right-panel">
    <app-patient-list

      (patientSelected)="onPatientSelected($event)">
    </app-patient-list>
  </div>
  
  <div class="left-panel">
    <!-- תצוגת ברירת מחדל - סיכומים -->
    <div *ngIf="!selectedPatient" class="summary-view">
      <div class="summary-card">
        <h2>סיכום מטופלים</h2>
        <p class="instruction">בחר מטופל מהרשימה לצפייה בפרטים</p>
      </div>
    </div>

    <!-- תצוגה כאשר נבחר מטופל -->
    <div *ngIf="selectedPatient" class="patient-view">
      <!-- כותרת עם לינקים -->
      <div class="header-tabs">
        <span><p>{{ selectedPatient.user.first_name }} {{ selectedPatient.user.last_name }}</p></span>
        <br />
        <button 
          class="tab-link" 
          [class.active]="activeTab === 'details'"
          (click)="setActiveTab('details')">
          <mat-icon>person</mat-icon>
          <span>פרטי מטופל</span>
        </button>

        <button 
          class="tab-link" 
          [class.active]="activeTab === 'mail'"
          (click)="setActiveTab('mail')">
          <mat-icon>mail</mat-icon>
          <span>דואר</span>
        </button>

        <button 
          class="tab-link" 
          [class.active]="activeTab === 'treatments'"
          (click)="setActiveTab('treatments')">
          <mat-icon>medical_services</mat-icon>
          <span>רשימת טיפולים</span>
        </button>
        
        <button class="close-btn" (click)="onCloseDetails()">
          <mat-icon>close</mat-icon>
        </button>
      </div>

      <!-- תוכן לפי הטאב הפעיל -->
      <div class="tab-content">

        <!-- רשימת טיפולים -->
        <div *ngIf="activeTab === 'treatments'" class="treatments-view">
          <div class="treatments-card">
            <app-treatment-list [patient]="selectedPatient.patient"></app-treatment-list>
          </div>
        </div>

        <!-- פרטי מטפל -->
        <div *ngIf="activeTab === 'details'" class="details-view">
          <app-patient-details [patient]="selectedPatient"></app-patient-details>
        </div>

        <!-- יומן -->
        <div *ngIf="activeTab === 'calendar'" class="calendar-view">
          <div class="calendar-card">
            <h3>יומן פגישות</h3>
            <p>כאן יוצג יומן הפגישות של המטפל</p>
            <!-- הוסף כאן את הקומפוננטה של היומן -->
          </div>
        </div>

        <!-- דואר -->
        <div *ngIf="activeTab === 'mail'" class="mail-view">
          <div class="mail-card">
            <h3>התכתבויות</h3>
            <p>כאן יוצגו ההתכתבויות עם המטפל</p>
            <!-- הוסף כאן את הקומפוננטה של הדואר -->
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
