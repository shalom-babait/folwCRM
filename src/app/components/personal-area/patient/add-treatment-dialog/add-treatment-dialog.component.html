<div class="create-treatment-dialog">
  <h2 class="dialog-title">טיפול חדש</h2>

  <div class="input-dialog">
    <form [formGroup]="treatmentForm">
      <div class="form-section" style="margin-bottom: 0;">
        <label class="section-label">סוג טיפול:</label>
        <div class="treatment-mode-selector">
          <div class="mode-option" [ngClass]="{'active': treatmentForm.get('meeting_type')?.value === 'frontal'}">
            <input type="radio" id="meeting_type-frontal" formControlName="meeting_type" value="frontal" style="display:none;" [checked]="treatmentForm.get('meeting_type')?.value === 'frontal'">
            <label for="meeting_type-frontal" class="option-content" tabindex="0">
              <mat-icon>groups</mat-icon>
              <span class="label">פרונטלי</span>
            </label>
          </div>
          <div class="mode-option" [ngClass]="{'active': treatmentForm.get('meeting_type')?.value === 'phone'}">
            <input type="radio" id="meeting_type-phone" formControlName="meeting_type" value="phone" style="display:none;" [checked]="treatmentForm.get('meeting_type')?.value === 'phone'">
            <label for="meeting_type-phone" class="option-content" tabindex="0">
              <mat-icon>call</mat-icon>
              <span class="label">טלפוני</span>
            </label>
          </div>
        </div>
      </div>


      <!-- מקום (חדר) - מוצג רק אם פרונטלי -->
  <div class="form-field" *ngIf="treatmentForm.get('meeting_type')?.value === 'frontal'">
        <label for="place">מקום</label>
        <select id="place" formControlName="place">
          <option [value]="null">בחר חדר</option>
          <option *ngFor="let room of rooms" [value]="room.room_id">{{ room.room_name }}</option>
        </select>
        <div class="error-message" *ngIf="treatmentForm.get('place')?.invalid && treatmentForm.get('place')?.touched">
          חובה לבחור חדר
        </div>
      </div>

      <!-- יומן חדר ב-overlay -->
      <app-calendar-overlay
        *ngIf="showOverlay"
        [showOverlay]="showOverlay"
        [selectedRoomId]="selectedRoomId"
        [roomEvents]="roomEvents"
        (overlayDateSelected)="onOverlayDateSelected($event)"
        (closeOverlayEvent)="closeOverlay()">
      </app-calendar-overlay>

      <!-- תאריך -->
      <div class="form-field">
        <label for="date">תאריך</label>
        <input type="date" id="date" formControlName="date">
        <div class="error-message" *ngIf="treatmentForm.get('date')?.invalid && treatmentForm.get('date')?.touched">
          חובה לבחור תאריך
        </div>
      </div>

      <!-- שעת התחלה -->
      <div class="form-field">
        <label for="startTime">שעת התחלה</label>
        <input type="time" id="startTime" formControlName="startTime">
        <div class="error-message" *ngIf="treatmentForm.get('startTime')?.invalid && treatmentForm.get('startTime')?.touched">
          חובה לבחור שעת התחלה תקינה
        </div>
      </div>

      <!-- שעת סיום -->
      <div class="form-field">
        <label for="endTime">שעת סיום</label>
        <input type="time" id="endTime" formControlName="endTime">
        <div class="error-message" *ngIf="treatmentForm.get('endTime')?.invalid && treatmentForm.get('endTime')?.touched">
          חובה לבחור שעת סיום תקינה
        </div>
      </div>
   
      <!-- סוג טיפול -->
      <div class="form-field">
        <label for="type">סוג טיפול</label>
        <select id="type" formControlName="type">
          <option [value]="''"></option>
          <option *ngFor="let type of types" [value]="type.group_id">{{ type.group_name }}</option>
        </select>
      </div>

      <!-- מטופל (מוסתר, אוטומטי) -->
      <input type="hidden" formControlName="patient_id">

      <!-- הערות (TextEditorComponent) -->
      <div class="form-field">
        <label for="notes">הערות</label>
          <app-text-editor formControlName="notes"></app-text-editor>
      </div>

      <div class="dialog-actions">
        <button type="button" (click)="onCancel()">ביטול</button>
        <button type="button" (click)="save()">שמור</button>
      </div>
    </form>
  </div>

</div>
