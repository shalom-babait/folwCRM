<!-- patient-list.component.html -->
<div class="patient-list-card">
  <div class="card-header">
    <h3>רשימת מטופלים</h3>
    <div class="header-actions">
      <button 
        class="add-patient-btn"
        (click)="openAddPatientDialog()"
        [disabled]="isLoading"
        matTooltip="הוסף מטופל חדש"
        matTooltipPosition="below">
        <mat-icon>add</mat-icon>
        <span>הוסף מטופל</span>
      </button>
      <button 
        class="search-btn"
        (click)="openSearchDialog()"
        [disabled]="isLoading"
        matTooltip="חיפוש מטופל">
        <mat-icon>search</mat-icon>
        <span>חיפוש</span>
      </button>
    </div>
  </div>

  <div class="card-content">
    <!-- אינדיקטור טעינה -->
    <div *ngIf="isLoading" class="loading-container">
      <mat-spinner diameter="40"></mat-spinner>
    </div>

    <!-- רשימת מטופלים -->
    <div *ngIf="!isLoading && patients.length > 0">
      <div 
        class="patient-card" 
        *ngFor="let patient of patients"
        [class.selected]="selectedPatientId === (patient.patient_id || patient.patient_id)"
        (click)="viewPatientDetails(patient)">
        <div class="patient-info">
<span class="patient-name">{{ patient.first_name }} {{ patient.last_name }}</span>        </div>
      </div>
    </div>

    <!-- הודעה אם אין מטופלים -->
    <div *ngIf="!isLoading && patients.length === 0" class="no-patients">
      <p>אין מטופלים כרגע</p>
      <p>לחץ על "הוסף מטופל" כדי להתחיל</p>
    </div>
  </div>
</div>
