<!-- patient-list.component.html -->
<div class="list-card">
  <div class="card-header">
    <h3>רשימת מטופלים</h3>
    <div class="header-actions">
      <!-- דרופדאון סינון מטפל -->
  
      <button class="add-item-btn" (click)="openAddPatientDialog()" [disabled]="isLoading"
        matTooltip="הוסף מטופל חדש" matTooltipPosition="below">
  <mat-icon>add</mat-icon>
      </button>
      <div class="search-input-wrapper">
  <mat-icon class="search-icon">search</mat-icon>
        <input
          type="text"
          [(ngModel)]="searchText"
          [disabled]="isLoading"
          placeholder="חפש מטופל..."
          class="search-input"
        />
          <select id="statusFilter" [(ngModel)]="statusFilter" style="margin-right: 0.5rem; padding: 0.3rem 0.7rem; border-radius: 6px; border: 1px solid #cfd8dc; background: #f5f5f5; font-size: 1rem; min-width: 90px; color: #000000;">
            <option value="all">הכל</option>
            <option value="active">פעילים</option>
            <option value="inactive">לא פעילים</option>
          </select>
      </div>
    </div>
    <ng-container *ngIf="!therapistId && therapists.length > 0">
        <mat-form-field appearance="outline" class="therapist-filter">
          <mat-label>סנן לפי מטפל</mat-label>
          <mat-select [(ngModel)]="selectedTherapistId" (selectionChange)="onTherapistFilterChange($event.value)">
            <mat-option [value]="null">כל המטפלים</mat-option>
            <mat-option *ngFor="let t of therapists" [value]="t.therapist.therapist_id">
              {{ t.person.first_name }} {{ t.person.last_name }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </ng-container>
  </div>

  <div class="card-content">
    <div *ngIf="isLoading" class="loading-container">
      <mat-spinner diameter="40"></mat-spinner>
    </div>

    <div *ngIf="!isLoading && filteredPatients.length > 0">
      <div class="list-item-card" *ngFor="let patient of filteredPatients | patientNameFilter:searchText"
        [class.selected]="selectedPatientId === (patient.patient ? patient.patient.patient_id : null)">
        <div class="item-info" (click)="viewPatientDetails(patient); logPatient(patient)">
          <span class="item-name">
            {{ patient.person.first_name || '---' }} {{ patient.person.last_name || '' }}
          </span>
        </div>
        <div class="list-actions">
          <button class="menu-button" [matMenuTriggerFor]="patientMenu" (click)="$event.stopPropagation()"
            matTooltip="פעולות">
            <mat-icon>more_vert</mat-icon>
          </button>
          <mat-menu #patientMenu="matMenu" xPosition="before" [backdropClass]="'transparent-backdrop'">
            <button mat-menu-item (click)="viewPatientDetails(patient)">
              <mat-icon>person</mat-icon>
              <span>הצג פרטי מטופל</span>
            </button>
            <button mat-menu-item (click)="deletePatient(patient)" class="delete-patient-btn">
              <mat-icon color="warn">delete</mat-icon>
              <span style="color: #c62828;">מחק מטופל</span>
            </button>
          </mat-menu>
        </div>

      </div>
    </div>

  <div *ngIf="!isLoading && filteredPatients.length === 0" class="no-items">
      <p>אין מטופלים כרגע</p>
      <p>לחץ על "הוסף מטופל" כדי להתחיל</p>
    </div>
  </div>
</div>
