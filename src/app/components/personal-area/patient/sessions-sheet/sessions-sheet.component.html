<div class="sessions-sheet">
  <div class="sheet-title-row">
    <h2 class="sheet-title">{{ title }}
      <button mat-icon-button (click)="printSheet()" title="הדפס גיליון">
        <mat-icon>print</mat-icon>
      </button>
    </h2>
  </div>

  <div class="sessions-list-wrapper">
    <div *ngIf="appointments && appointments.length; else noSessions" class="sessions-list">
      <div *ngFor="let app of appointments; let i = index" class="session-card">
        <div class="session-header" (click)="toggleNotes(i)">
          <div class="header-content">
            <span class="session-date">{{ app.appointment_date | date:'dd/MM/yyyy' }}</span>
            <span class="session-status" [ngClass]="'status-' + app.status">{{ app.status }}</span>
          </div>
          <span class="toggle-icon" [class.expanded]="expandedSessions[i]">
            <svg viewBox="0 0 24 24">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </span>
        </div>

        <div class="session-notes">
          <div class="session-notes-content">
            <span *ngIf="app.notes && app.notes.length; else noNotes" [innerHTML]="app.notes | linebreaks"></span>
            <ng-template #noNotes>
              <span class="no-notes">אין הערות</span>
            </ng-template>
          </div>

          <!-- כפתור ערוך בצד -->
          <button mat-stroked-button color="primary" class="edit-btn" *ngIf="!app.isEditing"
            (click)="app.isEditing = true">
            ערוך
          </button>

          <!-- מצב עריכה -->
          <ng-container *ngIf="app.isEditing">
            <textarea [(ngModel)]="app.notes" rows="4"></textarea>
            <div class="edit-actions">
              <div class="edit-actions">
                <button mat-stroked-button color="primary" (click)="onSave(app)">שמור</button>
                <button mat-stroked-button (click)="app.isEditing = false">ביטול</button>
              </div>
            </div>
          </ng-container>
        </div>
      </div>
    </div>
  </div>

  <ng-template #noSessions>
    <div class="empty-state">
      לא נמצאו מפגשים
    </div>
  </ng-template>
</div>
