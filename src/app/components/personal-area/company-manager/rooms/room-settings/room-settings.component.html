<div class="room-settings-card">
	<div class="settings-header">
		<h2>הגדרות חדר</h2>
		<button class="edit-icon" *ngIf="!editMode" (click)="editMode = true" matTooltip="ערוך הגדרות חדר">
			<mat-icon>edit</mat-icon>
		</button>
		<button class="edit-icon" *ngIf="editMode" (click)="editMode = false" matTooltip="ביטול עריכה">
			<mat-icon>close</mat-icon>
		</button>
	</div>
	<div class="settings-section">
		<label>שם חדר:</label>
		<ng-container *ngIf="!editMode; else editName">
			<span>{{ room.room_name }}</span>
		</ng-container>
		<ng-template #editName>
			<input type="text" [(ngModel)]="editedName" />
		</ng-template>
	</div>
		<div class="settings-section">
			<label>צבע חדר:</label>
			<input type="color" [(ngModel)]="roomColor" [disabled]="!editMode" />
		</div>
		<div class="settings-section">
			<label>הערות:</label>
			<ng-container *ngIf="!editMode; else editDesc">
				<span>{{ room.description || '-' }}</span>
			</ng-container>
			<ng-template #editDesc>
				<textarea [(ngModel)]="editedDescription" rows="2" style="width:100%"></textarea>
			</ng-template>
		</div>
	<!-- זמינות חדר -->
	<div class="settings-section">
		<label>זמינות חדר:</label>
	</div>
		<div class="room-availability-table">
			<table>
				<thead>
					<tr>
						<th>יום</th>
						<th>שעת התחלה</th>
						<th>שעת סיום</th>
						<th *ngIf="editMode">זמין</th>
					</tr>
				</thead>
				<tbody>
					<tr *ngFor="let avail of roomAvailability; let i = index">
						<td>{{ daysOfWeek[i] }}</td>
						<td *ngIf="!editMode">{{ avail.available === false ? '-' : avail.start_time }}</td>
						<td *ngIf="editMode">
							<input type="time" [(ngModel)]="roomAvailability[i].start_time" [disabled]="!roomAvailability[i].available" />
						</td>
						<td *ngIf="!editMode">{{ avail.available === false ? '-' : avail.end_time }}</td>
						<td *ngIf="editMode">
							<input type="time" [(ngModel)]="roomAvailability[i].end_time" [disabled]="!roomAvailability[i].available" />
						</td>
						<td *ngIf="editMode">
							<input type="checkbox" [(ngModel)]="roomAvailability[i].available" [checked]="roomAvailability[i].available !== false" />
						</td>
					</tr>
				</tbody>
			</table>
			<div *ngIf="editMode" class="availability-actions">
				<button (click)="applySameHoursToAll()">החל שעות על כל הימים</button>
			</div>
			<div *ngIf="editMode" class="settings-actions" style="margin-top: 1.5rem;">
				<button class="save-button" (click)="onSave()">
					שמור
				</button>
			</div>
		</div>
</div>
