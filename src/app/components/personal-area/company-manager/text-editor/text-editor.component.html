      <div class="form-field">
        <div *ngIf="!fullscreen">
       <button mat-icon-button (click)="fullscreen = true" style="float:left;" title="הגדלת תצוגה">
          <mat-icon>fullscreen</mat-icon>
        </button>

          <editor
            apiKey="152b7y6f6j0e7lb23ningkqc4uk74jslhp64hq5x71fy8nuc"
            [ngModel]="content"
            (ngModelChange)="onContentChange($event)"
            [init]="editorInit">
          </editor>
        </div>

        <div *ngIf="fullscreen" class="editor-fullscreen-overlay">
          <button mat-icon-button (click)="fullscreen = false" style="position:absolute;top:10px;left:10px;z-index:1001;" title="סגור תצוגה מלאה">
            <mat-icon>close</mat-icon>
          </button>
          <editor
            apiKey="152b7y6f6j0e7lb23ningkqc4uk74jslhp64hq5x71fy8nuc"
            [ngModel]="content"
            (ngModelChange)="onContentChange($event)"
            [init]="editorInit">
          </editor>
        </div>
      </div>
