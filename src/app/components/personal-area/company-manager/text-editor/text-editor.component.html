<div [ngClass]="{'full-height-editor': isFullHeight}">
  <div class="editor-header">
    <button class="icon-btn" (click)="toggleFullHeight()" title="הגדל עורך">
      <mat-icon>{{ isFullHeight ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon>
    </button>
    <!-- כאן אפשר להוסיף טקסט 'הערות' או כל כותרת -->
    <span class="editor-title">הערות</span>
  </div>
  <quill-editor
    [(ngModel)]="content"
    [modules]="modules"
    (onContentChanged)="onContentChanged($event)"
    dir="rtl"
    [style.height]="isFullHeight ? 'calc(100vh - 200px)' : '56px'"
    [style.minHeight]="isFullHeight ? 'calc(100vh - 200px)' : '56px'"
    [style.maxHeight]="isFullHeight ? '100vh' : '300px'">
  </quill-editor>
</div>
