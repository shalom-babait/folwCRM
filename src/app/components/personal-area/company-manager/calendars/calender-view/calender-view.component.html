<div class="calendar-view-container">
	<div class="calendar-sidebar">
		<app-mini-calender></app-mini-calender>
		<!-- תפריט כותרת יומנים -->
		<div class="calendar-header-menu" style="margin: 0.5rem 0 0.5rem 0;">
			<span style="font-weight: bold; font-size: 1.2rem;">יומנים</span>
		</div>
		<!-- שלושה צ'קבוקסים: הכל, חדרים, מטופלים -->
		<div class="calendar-checkboxes" style="margin-bottom: 0.5rem; display: flex; flex-direction: column; gap: 0.5rem;">
			<label><input type="checkbox" /> הכל</label>
			<label><input type="checkbox" /> חדרים</label>
			<label><input type="checkbox" /> מטופלים</label>
		</div>
	</div>
	<div class="calendar-main">
		<app-display-calendar></app-display-calendar>
	</div>
</div>
