<div class="treatment-types-list">
	<div class="header-section">
		<h2>הגדרות סוגי טיפולים</h2>
		<button class="add-button" (click)="openAddDialog()">
			<span class="add-icon">+</span>
			<span>הוסף סוג טיפול</span>
		</button>
	</div>
	<ul class="simple-list">
		<li *ngFor="let type of treatmentTypes" class="list-item">
			<span class="item-icon">🧠</span>
			<span class="item-text">{{ type.type_name }}</span>
		</li>
	</ul>
</div>
