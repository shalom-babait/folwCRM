<div class="list-card">
	<div class="card-header">
		<h3>רשימת סוגי טיפולים</h3>
		<div class="header-actions">
			<button class="add-item-btn" (click)="openAddDialog()">
				<mat-icon>add</mat-icon>
				<span>הוסף סוג טיפול</span>
			</button>
		</div>
	</div>
	<div class="card-content">
		<div *ngIf="treatmentTypes.length > 0">
			<div class="list-item-card" *ngFor="let type of treatmentTypes" (click)="selectTreatmentType(type)">
				<div class="item-info">
					<span class="item-name">{{ type.type_name }}</span>
				</div>
				<div class="list-actions">
					<button class="menu-button" [matMenuTriggerFor]="typeMenu" (click)="$event.stopPropagation()"
						matTooltip="פעולות">
						<mat-icon>more_vert</mat-icon>
					</button>
					<mat-menu #typeMenu="matMenu" xPosition="before" [backdropClass]="'transparent-backdrop'">
						<button mat-menu-item (click)="editTreatmentType(type)">
							<mat-icon>edit</mat-icon>
							<span>ערוך</span>
						</button>
						<button mat-menu-item (click)="deleteTreatmentType(type)" class="delete-type-btn">
							<mat-icon color="warn">delete</mat-icon>
							<span style="color: #c62828;">מחק</span>
						</button>
					</mat-menu>
				</div>
			</div>
		</div>
		<div *ngIf="treatmentTypes.length === 0" class="no-items">
			<p>אין סוגי טיפולים כרגע</p>
			<p>לחץ על "הוסף סוג טיפול" כדי להתחיל</p>
		</div>
	</div>
</div>
