<div class="view-container">
  <div class="right-panel">
    <app-treatment-types-list></app-treatment-types-list>
  </div>
  <div class="left-panel">
    <div *ngIf="!selectedTreatmentType" class="summary-view">
      <div class="summary-card">
        <h2>סיכום סוגי טיפולים</h2>
        <p class="instruction">בחר סוג טיפול מהרשימה לצפייה בפרטים</p>
      </div>
    </div>
    <div *ngIf="selectedTreatmentType" class="therapist-view">
      <div class="header-tabs">
        <button class="tab-link" [class.active]="activeTab === 'settings'" (click)="setActiveTab('settings')">
          <mat-icon>settings</mat-icon>
          <span>הגדרות</span>
        </button>
        <button class="tab-link" [class.active]="activeTab === 'protocols'" (click)="setActiveTab('protocols')">
          <mat-icon>description</mat-icon>
          <span>פרוטוקולים</span>
        </button>
        <button class="tab-link" [class.active]="activeTab === 'questionnaires'" (click)="setActiveTab('questionnaires')">
          <mat-icon>assignment</mat-icon>
          <span>שאלונים</span>
        </button>
        <button class="tab-link" [class.active]="activeTab === 'pricing'" (click)="setActiveTab('pricing')">
          <mat-icon>attach_money</mat-icon>
          <span>תמחור</span>
        </button>
        <button class="tab-link" [class.active]="activeTab === 'addons'" (click)="setActiveTab('addons')">
          <mat-icon>add_circle</mat-icon>
          <span>תוספות</span>
        </button>
        <button class="tab-link" [class.active]="activeTab === 'notes'" (click)="setActiveTab('notes')">
          <mat-icon>notes</mat-icon>
          <span>תיעוד</span>
        </button>
        <button class="tab-link" [class.active]="activeTab === 'files'" (click)="setActiveTab('files')">
          <mat-icon>attach_file</mat-icon>
          <span>קבצים</span>
        </button>
        <!-- ניתן להוסיף כאן כפתור סגירה בעתיד -->
      </div>
      <div class="tab-content">
        <div *ngIf="activeTab === 'settings'" class="details-view">
          <app-treatment-type-details></app-treatment-type-details>
        </div>
        <div *ngIf="activeTab === 'protocols'">
          <div style="text-align:center; color:#888; margin-top:2rem;">אין פרוטוקולים להצגה</div>
        </div>
        <div *ngIf="activeTab === 'questionnaires'">
          <div style="text-align:center; color:#888; margin-top:2rem;">אין שאלונים להצגה</div>
        </div>
        <div *ngIf="activeTab === 'pricing'">
          <div style="text-align:center; color:#888; margin-top:2rem;">אין נתוני תמחור להצגה</div>
        </div>
        <div *ngIf="activeTab === 'addons'">
          <div style="text-align:center; color:#888; margin-top:2rem;">אין תוספות להצגה</div>
        </div>
        <div *ngIf="activeTab === 'notes'">
          <div style="text-align:center; color:#888; margin-top:2rem;">אין תיעוד להצגה</div>
        </div>
        <div *ngIf="activeTab === 'files'">
          <div style="text-align:center; color:#888; margin-top:2rem;">אין קבצים להצגה</div>
        </div>
      </div>
    </div>
  </div>
</div>
