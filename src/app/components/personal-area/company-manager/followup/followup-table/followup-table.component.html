<div class="patient-list-container">
  <!-- שורת חיפוש וכפתור הוספה -->
  <div class="search-container">
    <button class="icon-button" mat-icon-button (click)="openCreateFollowupDialog()">
      <mat-icon style="color: #BB7E2B;">add</mat-icon>
    </button>

    <input type="text" placeholder="חיפוש לפי תאריך" class="search-input" [(ngModel)]="searchTerm">
  </div>

  <!-- כותרות -->
  <div class="treatment-row header-row">
    <div class="treatment-cell">תזכורת?</div>
    <div class="treatment-cell">תאריך מעקב</div>
    <div class="treatment-cell">שעה</div>
    <div class="treatment-cell">הערות</div>
    <div class="treatment-cell">פעולות</div>
  </div>

  <!-- נתונים -->
  <ng-container *ngIf="filteredFollowups.length > 0; else noFollowups">
    <div class="treatment-row data-row" *ngFor="let f of filteredFollowups">
      <div class="treatment-cell">
    <ng-container *ngIf="f.remind; else toggle">
            <mat-icon color="primary">check</mat-icon>
          </ng-container>
          <ng-template #toggle>
            <mat-slide-toggle name="remind" [(ngModel)]="f.remind" (change)="toggleReminder(f)"></mat-slide-toggle>
          </ng-template>
      </div>
      <div class="treatment-cell">{{ f.follow_date | date:'dd/MM/yyyy' }}</div>
      <div class="treatment-cell">{{ f.follow_time }}</div>
      <div class="treatment-cell">{{ f.notes }}</div>
      <div class="treatment-cell actions">
        <button mat-icon-button (click)="editFollowup(f)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="f.followup_id && deleteFollowup(f.followup_id)">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </div>
  </ng-container>
  <ng-template #noFollowups>
    <div class="no-followups-message">
      אין עדיין מעקבים. לחץ על הוספה להוספת מעקב.
    </div>
  </ng-template>
</div>
