
<app-month-selector></app-month-selector>

<div class="view-switcher">
  <button mat-icon-button [color]="viewMode === 'chart' ? 'primary' : ''" (click)="viewMode = 'chart'" aria-label="הצג גרף">
    <mat-icon>show_chart</mat-icon>
  </button>
  <button mat-icon-button [color]="viewMode === 'table' ? 'primary' : ''" (click)="viewMode = 'table'" aria-label="הצג טבלה">
    <mat-icon>table_chart</mat-icon>
  </button>
</div>

<div class="income-report-form-area">
  <ng-container *ngIf="viewMode === 'chart'; else tableBlock">
    <mat-form-field appearance="outline" style="min-width: 120px; margin-bottom: 16px;">
      <mat-label>בחר שנה</mat-label>
      <mat-select [(value)]="selectedYear" (selectionChange)="onYearChange($event.value)">
        <mat-option *ngFor="let year of years" [value]="year">{{ year }}</mat-option>
      </mat-select>
    </mat-form-field>
    <div class="chart-container">
      <app-chart-base
        [type]="chartType"
        [labels]="chartLabelsSafe"
        [datasets]="chartData.datasets"
        [options]="chartOptions || {}"
        (chartInit)="loadChartYearMonths()">
      </app-chart-base>
    </div>
  </ng-container>
  <ng-template #tableBlock>
    <h3>הכנסות מטיפולים</h3>
    <div *ngIf="selectedMonths.length || selectedYear" class="selected-filter-info" style="margin-bottom: 12px; font-size: 1.1em;">
      <span *ngIf="selectedYear">שנה נבחרה: {{ selectedYear }}</span>
      <span *ngIf="selectedMonths.length">
        | חודשים נבחרים:
        {{ getSelectedMonthsLabel() }}
      </span>
    </div>
    <ng-container *ngIf="incomeByMonths.length > 0">
      <div *ngFor="let monthData of incomeByMonths">
        <h4 style="margin-top: 24px; margin-bottom: 8px;">{{ getMonthLabel(monthData.month) }} (סה"כ: ₪{{ monthData.total }})</h4>
        <table class="income-table">
          <thead>
            <tr>
              <th>שם לקוח</th>
              <th>סכום הכנסה</th>
              <th>פעולות</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let client of monthData.clients">
              <td>{{ client.client_name }}</td>
              <td>₪{{ client.total }}</td>
              <td>
                <button class="menu-button" matTooltip="דיווח על תשלום" (click)="reportPayment(client)">
                  <mat-icon>payments</mat-icon>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="total" style="margin-top: 24px;">
        סך הכל הכנסות מטיפולים: <strong>₪{{ totalIncome }}</strong>
      </div>
    </ng-container>
  </ng-template>
</div>
