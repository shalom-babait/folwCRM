<div class="debt-report-form-area">
	<h3>רשימת חובות פתוחים</h3>
	<table class="debt-table">
		<thead>
			<tr>
				<th>שם מטופל</th>
				<th>סכום חוב פתוח</th>
			</tr>
		</thead>
		<tbody>
			<tr *ngFor="let row of debts">
				<td>{{ row.patient_name }}</td>
				<td>₪{{ row.open_balance }}</td>
			</tr>
		</tbody>
	</table>
	<div class="total" *ngIf="debts.length">
		סך כל החובות: <strong>₪{{ getTotalDebts() }}</strong>
	</div>
</div>
