<div class="debt-report-form-area">
	<h3>רשימת חובות פתוחים</h3>
	<table class="debt-table">
		<thead>
			<tr>
				<th>שם מטופל</th>
				<th>סכום חוב פתוח</th>
				<th>פעולות</th>
			</tr>
		</thead>
		<tbody>
			<tr *ngFor="let row of debts">
				<td>{{ row.patient_name }}</td>
				<td>₪{{ row.open_balance }}</td>
				<td>
					<button class="menu-button" [matMenuTriggerFor]="debtMenu" matTooltip="פעולות">
						<mat-icon>more_vert</mat-icon>
					</button>
					<mat-menu #debtMenu="matMenu" xPosition="before" [backdropClass]="'transparent-backdrop'">
						<button mat-menu-item (click)="reportPayment(row)">
							<mat-icon>payments</mat-icon>
							<span>דווח על תשלום</span>
						</button>
					</mat-menu>
				</td>
			</tr>
		</tbody>
	</table>
	<div class="total" *ngIf="debts.length">
		סך כל החובות: <strong>₪{{ getTotalDebts() }}</strong>
	</div>
</div>
