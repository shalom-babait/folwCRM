<div class="reports-view-container">
  <div class="reports-list-panel">
    <app-reports-list (reportSelected)="onReportSelected($event)"></app-reports-list>
  </div>
  <div class="report-details-panel">
    <app-debt-report *ngIf="selectedReport?.id === -1"></app-debt-report>
    <app-report-details *ngIf="selectedReport?.id !== -1" [report]="selectedReport"></app-report-details>
  </div>
</div>
