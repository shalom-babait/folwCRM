<div class="reports-view-container">
  <div class="reports-list-panel">
    <app-reports-list (reportSelected)="onReportSelected($event)"></app-reports-list>
  </div>
  <div class="report-details-panel">
    <app-debt-report *ngIf="selectedReport?.id === -1"></app-debt-report>
    <app-expenses-table *ngIf="selectedReport?.id === 2"></app-expenses-table>
    <app-appointment-reports *ngIf="selectedReport?.id === 3"></app-appointment-reports>
    <app-report-details *ngIf="selectedReport && selectedReport.id !== -1 && selectedReport.id !== 2" [report]="selectedReport"></app-report-details>
  </div>
</div>
