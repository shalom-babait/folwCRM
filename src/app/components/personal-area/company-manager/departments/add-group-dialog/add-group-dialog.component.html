<div class="create-treatment-dialog">
  <h2 class="dialog-title">הוספת קבוצה חדשה</h2>
  <form class="input-dialog" [formGroup]="groupForm">
    <div class="form-field">
      <label for="group_name">שם קבוצה</label>
      <input id="group_name" type="text" formControlName="group_name" placeholder="הזן שם קבוצה">
      <div class="error-message" *ngIf="groupForm.get('group_name')?.hasError('required')">
        שם הקבוצה הוא שדה חובה
      </div>
      <div class="error-message" *ngIf="groupForm.get('group_name')?.hasError('minlength')">
        שם הקבוצה חייב להכיל לפחות 2 תווים
      </div>
    </div>
    <div class="dialog-actions">
      <button type="button" class="cancel-button" (click)="onCancel()" [disabled]="isSubmitting">
        ביטול
      </button>
      <button type="submit" class="save-button" (click)="onSubmit()" [disabled]="!groupForm.valid || isSubmitting">
        <span *ngIf="!isSubmitting">הוסף</span>
        <span *ngIf="isSubmitting">מוסיף...</span>
      </button>
    </div>
  </form>
</div>
