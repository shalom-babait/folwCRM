<div class="transaction-form">
  <h3>הוספת עסקה חדשה</h3>

  <!-- בחירת סוג העסקה -->
  <div class="form-section">
    <label class="section-label">סוג העסקה:</label>
    <div class="transaction-type-selector">
      <label class="type-option" [class.active]="transactionType === 'debit'">
        <input type="radio" name="transactionType" value="debit"
               [(ngModel)]="transactionType"
               (change)="onTransactionTypeChange()">
        <div class="option-content">
          <mat-icon>assignment</mat-icon>
          <span class="label">חוב (טיפול)</span>
        </div>
      </label>

      <label class="type-option" [class.active]="transactionType === 'credit'">
        <input type="radio" name="transactionType" value="credit"
               [(ngModel)]="transactionType"
               (change)="onTransactionTypeChange()">
        <div class="option-content">
          <mat-icon>payment</mat-icon>
          <span class="label">תשלום</span>
        </div>
      </label>
    </div>
  </div>

  <!-- טופס חוב -->
  <div class="form-content" *ngIf="transactionType === 'debit'">

    <div class="form-group">
      <label>בחר תור:</label>
      <select [(ngModel)]="debitForm.appointment_id" class="form-control">
        <option value="">-- בחר תור --</option>

        <option *ngFor="let apt of appointments" [value]="apt.appointment_id">
          {{ apt.appointment_date }} - {{ apt.start_time }} |
          {{ apt.therapist_name }} | {{ apt.type_name }}
        </option>

      </select>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>סכום החוב (₪):</label>
        <input type="number" [(ngModel)]="debitForm.amount"
               min="0" step="10" placeholder="0"
               class="form-control">
      </div>

      <div class="form-group">
        <label>תאריך:</label>

        <!-- עכשיו זה עובד תקין: מציג היום כברירת מחדל -->
        <input type="date"
               [(ngModel)]="debitForm.payment_date"
               class="form-control">
      </div>
    </div>
  </div>

  <!-- טופס תשלום -->
  <div class="form-content" *ngIf="transactionType === 'credit'">

    <div class="form-row">
      <div class="form-group">
        <label>סכום התשלום (₪):</label>
        <input type="number" [(ngModel)]="creditForm.amount"
               min="0" step="10" placeholder="0"
               class="form-control">
      </div>

      <div class="form-group">
        <label>תאריך תשלום:</label>

        <!-- מציג תאריך ברירת מחדל = היום -->
        <input type="date"
               [(ngModel)]="creditForm.payment_date"
               class="form-control">
      </div>
    </div>

    <div class="form-group">
      <label>אמצעי תשלום:</label>
      <div class="payment-methods">
        <label *ngFor="let method of paymentMethods"
               class="method-option"
               [class.selected]="creditForm.method === method.value">

          <input type="radio" name="paymentMethod"
                 [value]="method.value"
                 [(ngModel)]="creditForm.method">

          <span>{{ method.label }}</span>
        </label>
      </div>
    </div>

    <div *ngIf="creditForm.method === 'card'">
      <div class="form-row">

        <div class="form-group">
          <label>סטטוס התשלום:</label>
          <select [(ngModel)]="creditForm.status" class="form-control">
            <option *ngFor="let status of paymentStatuses" [value]="status.value">
              {{ status.label }}
            </option>
          </select>
        </div>

      </div>
    </div>

  </div>

  <!-- כפתורים -->
  <div class="form-actions">
    <button class="btn-cancel" (click)="onCancel()">ביטול</button>
    <button class="btn-submit" (click)="onSubmit()">
      {{ transactionType === 'debit' ? 'הוסף חוב' : 'רשום תשלום' }}
    </button>
  </div>

</div>
