<div class="login-fullpage-container" (keydown.enter)="onEnter()">
  <div class="login-center-box">
    <div class="titleContainer">
    <img src="../../../../assets/photoes/LOGO.png" alt="לוגו" class="login-logo" />
        <h2 class="login-title">כניסה לאזור האישי</h2>
    </div>
    <div class="connection">
    <input class="login-input" type="text" name="user_name" placeholder="*שם משתמש" required [(ngModel)]="user_name">
        <div class="password-container">
            <input class="login-input" 
                   [type]="showPassword ? 'text' : 'password'" 
                   name="password" 
                   placeholder="*סיסמה" 
                   required 
                   [(ngModel)]="password">
            <span class="eye-icon" (click)="togglePasswordVisibility()" [class.visible]="showPassword"></span>
        </div>
    <button class="submitButton" (click)="onLogin()">כניסה</button>
        
        <!-- Google Sign-In Button -->
        <div class="google-signin-container">
            <div class="divider">
                <span>או</span>
            </div>
            <button class="google-signin-button" (click)="loginWithGoogle()" type="button">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="google-icon">
                <span>המשך עם Google</span>
            </button>
        </div>

        <a class="subtitle" (click)="showSendingPasswordToMail()" style="color: #3F6B60; cursor: pointer;">שכחתי סיסמה</a>
        <a class="subtitle" (click)="showChangePassword()" style="color: #3F6B60; cursor: pointer; margin-right: 20px;">החלפת סיסמה</a>
    </div>
    <div *ngIf="SendingPasswordToMail">
        <div class="showSendingPasswordToMail">
            <label class="dialogTitle">שחזור סיסמה</label>
            <input class="login-input" 
                   type="text" 
                   name="resetUserName" 
                   placeholder="שם משתמש" 
                   required 
                   [(ngModel)]="resetUserName">
            <button class="submitButton SubmitNewPasswordButton" 
                    (click)="sendResetPassword()" 
                    [disabled]="!resetUserName || isLoadingReset">
                {{ isLoadingReset ? 'שולח...' : 'שלח סיסמה חדשה למייל' }}
            </button>
        </div>
    </div>
    <div *ngIf="passwordHasBeenSent">
        <div class="passwordHasBeenSent">
            <label class="dialogTitle">!הסיסמה נשלחה בהצלחה</label>
            <p style="font-size: 18px; color: #e74c3c; font-weight: bold; margin: 10px 0;">
                ⏱️ זמן נותר: {{ countdown }}
            </p>
            <p style="font-size: 14px; color: #666; margin: 10px 0;">
                סיסמה זמנית נשלחה למייל שלך. השתמש בה תוך 5 דקות!
            </p>
            <button class="submitButton SubmitNewPasswordButton" (click)="showConnectionForm()">חזור להתחברות</button>
        </div>
    </div>
    <div *ngIf="forgatPassword">
        <div class="showForgotPassword">
            <label class="dialogTitle">שחזור סיסמה</label>
            <input class="login-input" type="password" name="password" placeholder="סיסמה" required>
            <input class="login-input" type="password" name="password" placeholder="בחר סיסמה חדשה" required>
            <input class="login-input" type="password" name="password" placeholder="אימות סיסמה חדשה" required>
            <button class="submitButton">כניסה</button>
        </div>
    </div>
    
    <!-- דיאלוג החלפת סיסמה -->
    <div *ngIf="changePasswordDisplayed">
        <div class="showSendingPasswordToMail">
            <label class="dialogTitle">החלפת סיסמה</label>
            <input class="login-input" 
                   type="text" 
                   name="changeUserName" 
                   placeholder="שם משתמש" 
                   required 
                   [(ngModel)]="changePasswordData.user_name">
            <input class="login-input" 
                   type="password" 
                   name="oldPassword" 
                   placeholder="סיסמה ישנה" 
                   required 
                   [(ngModel)]="changePasswordData.oldPassword">
            <input class="login-input" 
                   type="password" 
                   name="newPassword" 
                   placeholder="סיסמה חדשה" 
                   required 
                   [(ngModel)]="changePasswordData.newPassword">
            <input class="login-input" 
                   type="password" 
                   name="confirmPassword" 
                   placeholder="אימות סיסמה חדשה" 
                   required 
                   [(ngModel)]="changePasswordData.confirmPassword">
            <button class="submitButton SubmitNewPasswordButton" 
                    (click)="changePassword()" 
                    [disabled]="isLoadingChange || !changePasswordData.user_name || !changePasswordData.oldPassword || !changePasswordData.newPassword || !changePasswordData.confirmPassword">
                {{ isLoadingChange ? 'משנה...' : 'שנה סיסמה' }}
            </button>
            <button class="submitButton" 
                    (click)="showConnectionForm()" 
                    style="margin-top: 10px; background-color: #999;">
                ביטול
            </button>
        </div>
    </div>
  </div>
</div>
